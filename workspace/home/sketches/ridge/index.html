<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge, 3 a.m.</title>
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --night: #100f15;
    --stage: #08070b;
    --ink: #ece9e1;
    --muted: #a8a398;
    --faint: #7a766d;
    --line: #2d2b34;
    --accent: #e8743b;
    --serif: "Iowan Old Style", Charter, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--night);
    overflow: hidden;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #copy {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #copy.hidden { visibility: hidden; }
  .blk { position: absolute; margin: 0; font-weight: 400; }

  /* display serif */
  .t-name, .t-word, .t-heading {
    font-family: var(--serif);
    font-style: italic;
    letter-spacing: -0.012em;
    line-height: 0.98;
    white-space: nowrap;
  }
  .t-word {
    transform: translate(-50%, -54%);
    letter-spacing: -0.02em;
  }
  .t-display {
    font-family: var(--serif);
    line-height: 1.07;
    letter-spacing: -0.008em;
    white-space: nowrap;
  }
  .t-display em { font-style: italic; }
  .t-body {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* mono labels */
  .t-mono, .t-cue, .t-links, .t-label {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .t-mono { color: var(--muted); }
  .t-cue { color: var(--faint); font-size: 11px; }
  .t-cue::after {
    content: "";
    display: block;
    width: 1px;
    height: 44px;
    margin: 14px 0 0 1px;
    background: var(--faint);
  }
  .t-cue.arrow::after {
    display: inline-block;
    width: 34px;
    height: 1px;
    margin: 0 0 0 14px;
    vertical-align: middle;
  }
  .t-links { display: flex; gap: 2.4em; color: var(--muted); }
  .t-links a {
    color: inherit;
    text-decoration: none;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--line);
    pointer-events: auto;
  }
  .t-label {
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 0.2em;
    text-shadow: 0 0 2px var(--night), 0 0 5px var(--night), 0 0 9px var(--night);
  }
  .t-label.center { transform: translateX(-50%); }
  .t-label.right { transform: translateX(-100%); }
  .t-label .idx { color: var(--faint); margin-right: 0.7em; }

  #copy[data-layout="portrait"] .t-mono { font-size: 11px; letter-spacing: 0.18em; }
  #copy[data-layout="portrait"] .t-body { font-size: 17px; }
  #copy[data-layout="portrait"] .t-links { gap: 1.6em; font-size: 11px; }
  #copy[data-layout="portrait"] .t-display,
  #copy[data-layout="portrait"] .t-heading { white-space: normal; }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="copy"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
