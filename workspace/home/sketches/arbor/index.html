<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forking Paths</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --night: #100f15;
        --stage: #08070b;
        --ink: #ece9e1;
        --muted: #a8a398;
        --faint: #7a766d;
        --line: #2d2b34;
        --accent: #e8743b;
        --serif: 'Iowan Old Style', Charter, Georgia, serif;
        --mono: ui-monospace, 'SF Mono', Menlo, monospace;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--night);
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay[hidden] {
        display: none;
      }
      .t {
        position: absolute;
        margin: 0;
        color: var(--ink);
        white-space: nowrap;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        text-shadow:
          0 0 2px rgba(16, 15, 21, 0.9),
          0 0 14px rgba(16, 15, 21, 0.85);
      }
      .mono {
        font-family: var(--mono);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        line-height: 1.7;
      }
      .name {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 400;
        line-height: 0.94;
        letter-spacing: -0.012em;
      }
      .tag {
        color: var(--muted);
      }
      .cue {
        color: var(--faint);
        padding-top: 40px;
      }
      .cue::before {
        content: '';
        position: absolute;
        left: 0.15em;
        top: 0;
        width: 1px;
        height: 28px;
        background: var(--faint);
      }
      .display {
        font-family: var(--serif);
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.006em;
      }
      .display em {
        font-style: italic;
      }
      .display.big {
        font-style: italic;
        line-height: 0.94;
        letter-spacing: -0.014em;
      }
      .body {
        font-family: var(--serif);
        color: var(--muted);
        line-height: 1.5;
        white-space: normal;
      }
      .word {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        text-shadow:
          0 0 2px var(--night),
          0 0 22px rgba(16, 15, 21, 0.95),
          0 0 64px rgba(16, 15, 21, 0.85);
      }
      .open {
        color: var(--ink);
        padding-top: 0;
        padding-left: 52px;
      }
      .open::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        width: 38px;
        height: 1px;
        background: var(--muted);
      }
      .links {
        display: flex;
        gap: 2.6em;
        color: var(--muted);
      }
      .links a {
        color: inherit;
        text-decoration: none;
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--line);
        pointer-events: auto;
      }
      .label {
        color: var(--ink);
        letter-spacing: 0.2em;
        line-height: 1;
      }
      .label .num {
        color: var(--faint);
        margin-right: 0.85em;
      }
      .label.stack .num {
        display: block;
        margin: 0 0 0.45em;
      }
      .label.left {
        text-align: left;
      }
      .label.right {
        text-align: right;
      }
      .label.center {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="overlay"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
