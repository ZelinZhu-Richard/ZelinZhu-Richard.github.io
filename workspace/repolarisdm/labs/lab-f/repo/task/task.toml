# Harbor task configuration. Field names follow the Harbor docs (task.toml schema 1.3),
# checked on 2026-10-20; not yet run with the Harbor CLI. The lab's run_task.sh does not
# read this file. Its --docker mode mirrors these settings (no network, tests uploaded
# after the agent, verifier in the same container). Its local mode does not block the network.
schema_version = "1.3"

[task]
name = "polaris-playbook/freebusy-merge"
description = "Implement merge_busy: merge room bookings into busy spans (half-open intervals, aware datetimes, tolerance)."
keywords = ["python", "intervals", "datetime", "timezones"]

[metadata]
difficulty_explanation = "One function, many boundary rules: touching and tolerance gaps, empty bookings, mixed UTC offsets, no side effects."
category = "programming"

[verifier]
timeout_sec = 120.0
# The verifier reads /app, which the agent changed, so it shares the agent's container.
environment_mode = "shared"
network_mode = "no-network"

[agent]
timeout_sec = 1800.0
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
